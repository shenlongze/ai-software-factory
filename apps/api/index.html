<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务视图 · Factory</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --line:#d2d2d7;
    --brand:#0071e3; --ok:#34c759; --warn:#ff9f0a; --dead:#ff3b30;
    --r:18px; --shadow:0 4px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:9;background:rgba(245,245,247,.78);
         backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
         border-bottom:1px solid var(--line)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .bar{display:flex;align-items:center;gap:16px;height:64px}
  .brand{font-weight:600;font-size:19px;letter-spacing:-.01em}
  .brand small{color:var(--ink2);font-weight:400;margin-left:8px;font-size:13px}
  select{margin-left:auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
         background:#fff;font-size:14px;color:var(--ink);outline:none}
  main{padding:28px 0 80px}
  .hero{display:flex;align-items:baseline;gap:14px;margin:6px 0 10px}
  h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0}
  .pill{font-size:13px;color:var(--ink2);background:#fff;border:1px solid var(--line);
        padding:4px 12px;border-radius:999px}
  .prog{margin:10px 0 26px;height:8px;border-radius:999px;background:#e8e8ed;overflow:hidden}
  .prog span{display:block;height:100%;background:linear-gradient(90deg,#0071e3,#3d9bff);
             border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 18px}
  .card h2{font-size:15px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .sub{color:var(--ink2);font-size:13px;margin:0 0 18px}
  /* 待办清单 */
  .row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .row .mark{width:18px;text-align:center;flex:none;font-size:14px}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .nm.d0{font-weight:600}
  .row .who{color:var(--ink2);font-size:12.5px;flex:none}
  .row .pg{color:var(--ink2);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
  .row.d1{padding-left:26px}
  .row.d2{padding-left:52px}
  .row.d3{padding-left:78px}
  /* ★ 跨视图联动: 选中态 / 命中块 / 落选变灰 */
  .row{cursor:default}
  #todo .row[data-kind="domain"].d0{cursor:pointer}
  #todo .row[data-kind="domain"].d0:hover{background:#f5f5f7;border-radius:8px}
  .row.sel{background:#eef5ff;border-radius:8px;box-shadow:inset 3px 0 0 var(--brand)}
  .row.sel-kid{background:#f7faff}
  .row.dimsel{opacity:.3}
  /* ★ 关键路径: 节点/边/清单条目的专属样式（核心=被依赖最多; 关键路径=决定整体完工） */
  .node.crit rect{stroke:#ff9f0a;stroke-width:2.2}
  .edge.k-crit{stroke:#ff9f0a;stroke-width:2.2;marker-end:url(#arO)}
  .row .star{display:inline-block;width:13px;color:#ff9f0a;font-size:12px}
  .kpline{background:#fff8e6;border:1px solid #ffe2a8;color:#7a5b00;border-radius:10px;
          padding:8px 12px;font-size:12.5px;margin:0 0 12px;line-height:1.7}
  .kpline b{color:#4a3600}
  .node.sel rect{stroke:var(--brand);stroke-width:2.6}
  .node.sel .nm{font-weight:600}
  /* 功能链路图（★ 真图: 节点 + 连线。第 N 批 = 第 N 行, 自上而下做） */
  #flow svg{display:block;max-width:100%;height:auto;overflow:visible}
  .band{fill:#fafafc}
  .band-lb{font-size:11px;fill:var(--ink2)}
  .node{cursor:pointer}
  .node rect{fill:#fff;stroke:var(--line);stroke-width:1.2}
  .node .nm{font-size:12.5px;fill:var(--ink);font-weight:500}
  .node .mt{font-size:10.5px;fill:var(--ink2)}
  .node.core rect{stroke:var(--brand);stroke-width:1.8}
  .node.core .nm{fill:#0058b0;font-weight:600}
  .node.dim{opacity:.25}
  .node.hot rect{stroke-width:2}
  .node.hot.up rect{stroke:var(--warn)}
  .edge{fill:none;stroke:#c7c7cc;stroke-width:1.3;marker-end:url(#ar)}
  .edge.dim{opacity:.15}
  .edge.hot{stroke:var(--brand);stroke-width:2;marker-end:url(#arB)}
  .edge.hot.up{stroke:var(--warn);marker-end:url(#arO)}
  /* ★ 数据流程图: 线索=虚线(文案证据), 声明=实线(系统记录), 外键=细实线 */
  #df svg{display:block;max-width:100%;height:auto;overflow:visible}
  .edge.dash{stroke-dasharray:5 4}
  .edge.k-declared{stroke:#0071e3;stroke-width:2;marker-end:url(#arB)}
  .edge.k-fk{stroke:#00a37a;stroke-width:1.4;marker-end:url(#arG)}
  .node.dimstatic{opacity:.4}
  .bi-lb{font-size:11px;fill:var(--ink2)}
  .srcline{color:var(--ink2);font-size:12.5px;margin:10px 0 0}
  .srcline b{color:var(--ink);font-weight:600}
  .gap{background:#fff8e6;border:1px solid #ffe2a8;color:#7a5b00;border-radius:10px;
       padding:8px 12px;font-size:12.5px;margin-top:12px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:12px;margin-top:16px}
  .legend b{color:var(--ink);font-weight:600}
  #kids{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  #kids .kt{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
  /* 子模块列表（点模块后展开） */
  details.mod{border-left:2px solid var(--line)}
  details.mod[open]{border-left-color:var(--brand)}
  details.mod>summary{list-style:none;cursor:pointer;padding:5px 0 5px 12px;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  details.mod>summary::-webkit-details-marker{display:none}
  details.mod>summary::before{content:"▸";color:var(--ink2);font-size:11px;flex:none}
  details.mod[open]>summary::before{content:"▾"}
  .mod.flat{padding:5px 0 5px 12px;border-left:2px solid var(--line);
            display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .mod .mark{width:16px;text-align:center;flex:none;font-size:14px}
  .mod .nm{font-size:13.5px}
  .mod .nm.sub{font-size:12.5px;color:var(--ink2)}
  .mod .meta{color:var(--ink2);font-size:11.5px}
  .mod.core .nm{color:#0058b0;font-weight:600}
  .kids{padding-left:20px}
  .empty{color:var(--ink2);font-size:14px;padding:40px 0;text-align:center}
  .foot{color:var(--ink2);font-size:12.5px;margin-top:26px;text-align:center}
  .err{background:#fff2f0;border:1px solid #ffd6d0;color:#b3261e;border-radius:12px;
       padding:14px 16px;font-size:14px;margin:20px 0}
</style>
</head>
<body>
<!-- ★ 箭头 marker 全页只定义一次（SVG 里重复定义 id 会互相覆盖） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c7c7cc"></path></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0071e3"></path></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"></path></marker>
  <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00a37a"></path></marker>
</defs></svg>
<header>
  <div class="wrap bar">
    <div class="brand">Factory<small>用户视图 · 同一份数据的三种看法</small></div>
    <select id="pick"></select>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 id="title">加载中…</h1>
    <span class="pill" id="status"></span>
  </div>
  <div class="prog"><span id="bar" style="width:0%"></span></div>
  <div id="msg"></div>
  <p class="sub" id="selhint" style="margin:0 0 14px"></p>

  <div class="cols">
    <!-- 投影 B: 功能链路图（看关系） -->
    <section class="card">
      <h2><span class="dot"></span>功能链路图</h2>
      <p class="sub">这个需求包含哪些功能、它们怎么串起来（先后顺序）</p>
      <div id="flow"></div>
    </section>
    <!-- 投影 A: 层级待办清单（看进度） -->
    <section class="card">
      <h2><span class="dot"></span>层级待办清单</h2>
      <p class="sub">要做的活、谁在做、做到哪了（★ 点模块名 ⇒ 三张图联动定位）</p>
      <div id="todo"></div>
    </section>
  </div>

  <!-- 投影 C: 数据流程图（看数据 —— 实体 / 谁碰它 / 数据之间怎么连） -->
  <section class="card" style="margin-top:20px">
    <h2><span class="dot"></span>数据流程图</h2>
    <p class="sub">数据长什么样、哪个模块碰它、数据之间怎么连 —— ★ 只画真实来源（DDL / 产线声明），文案线索一律标虚线</p>
    <div id="df"></div>
  </section>

  <p class="foot">★ 三个视图读的是同一份任务树数据 —— 说的是一件事的三种看法</p>
</main>

<script>
const MARK = {todo:"☐", doing:"🚧", done:"✅", dead:"⛔"};
const esc = s => (s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

function err(m){ $("msg").innerHTML = `<div class="err">${esc(m)}</div>`; }

async function api(path){
  const r = await fetch(path);
  if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`); }
  return r.json();
}

function renderTodo(d){
  if(!d.lines || !d.lines.length) return `<div class="empty">暂无任务</div>`;
  // ★ 关键路径说明（Founder: "待办清单中没有关键路径的说明, 需要如何判断"）—— 说清判据, 不写个 ★ 就完事
  const kp = d.critical_path || {};
  const kpline = kp.available
    ? `<div class="kpline">★ <b>关键路径</b>: <b>${kp.total}</b> 条在链上（就是标 ★ 的这些 —— 推迟其中任一条 = 整棵完不成）
        　链外的是可并行的旁支·可以晚做<br/>判定依据: ${esc(kp.basis)}${kp.note ? "<br/>口径: " + esc(kp.note) : ""}</div>`
    : (kp.reason ? `<div class="kpline">⚠ 关键路径算不出: ${esc(kp.reason)}（★ 不硬给一条假的）</div>` : "");
  // ★ data-id/data-kind/data-depth = 跨视图联动的"键"（服务层早就给了 id, 之前没用上）
  return kpline + d.lines.map(l => {
    const who = l.who ? `<span class="who">${esc(l.who)}</span>` : "";
    const pg  = l.kind === "domain" ? `<span class="pg">${l.done}/${l.total}</span>` : "";
    return `<div class="row d${Math.min(l.depth,3)}" data-id="${esc(l.id)}"
      data-kind="${esc(l.kind)}" data-depth="${l.depth}">
      <span class="mark">${MARK[l.mark]||"☐"}</span><span class="star">${l.critical ? "★" : ""}</span>
      <span class="nm ${l.depth===0?"d0":""}">${esc(l.name)}</span>${pg}${who}</div>`;
  }).join("");
}

// ★ 一个模块一行; 有子模块的用 <details> 原生折叠（不写 JS 状态机 —— 少一处能坏的地方）
function renderMod(m, depth){
  const bits = [];
  if((m.deps||[]).length) bits.push(`前置: ${m.deps.join(" / ")}`);
  if(m.core) bits.push(`★ 核心（被 ${m.depended_by} 个依赖）`);
  else if(m.depended_by) bits.push(`被 ${m.depended_by} 个依赖`);
  if(m.kids) bits.push(`${m.kids} 个子模块`);
  const head = `<span class="mark">${MARK[m.status]||"☐"}</span>`
             + `<span class="nm${depth?" sub":""}">${esc(m.name)}</span>`
             + (bits.length ? `<span class="meta">${esc(bits.join(" · "))}</span>` : "");
  if(!(m.children||[]).length) return `<div class="mod flat${m.core?" core":""}">${head}</div>`;
  return `<details class="mod${m.core?" core":""}"><summary>${head}</summary>`
       + `<div class="kids">${m.children.map(c => renderMod(c, depth+1)).join("")}</div></details>`;
}

// ── 功能链路图: 真图（节点 + 连线）────────────────────────────────
// ★ Founder: "还是堆砌，没有形式流程图，功能和功能之间看不到任何关系"
//   ⇒ 列表读不出关系, 必须是图: 节点 = 模块, 连线 = 前置关系。
let FLOW = null;                       // 当前 flow 数据（悬停/点击时要用）

const _trunc = (s, n) => (s || "").length > n ? s.slice(0, n - 1) + "…" : (s || "");

// 传递闭包: 顺着 adj 能走到的全部节点 —— 用来"追一条链"
function _closure(id, adj){
  const seen = new Set(), q = [...(adj.get(id) || [])];
  while(q.length){
    const x = q.pop();
    if(x === id || seen.has(x)) continue;
    seen.add(x);
    (adj.get(x) || []).forEach(y => q.push(y));
  }
  return seen;
}

// ── 共用: 分层图（第 N 层 = 第 N 行, 自上而下）─────────────────────
//    功能链路图(模块·前置) 与 数据流程图(实体·外键) 共用同一套布局 —— 一处布局, 两处受益
const G = {BW: 128, BH: 40, GX: 16, GY: 48, PADY: 30};
function svgBand(nodes, edges, opts){
  const o = opts || {}, dashed = o.dashed || [], padx = o.padx || 50;
  const byLv = {};
  nodes.forEach(n => { const L = n.level || 1; (byLv[L] = byLv[L] || []).push(n); });
  const levels = Object.keys(byLv).map(Number).sort((a, b) => a - b);
  const maxN = Math.max(1, ...levels.map(L => byLv[L].length));
  const W = padx * 2 + maxN * G.BW + (maxN - 1) * G.GX;
  const H = G.PADY * 2 + levels.length * G.BH + (levels.length - 1) * G.GY;
  const pos = {};
  levels.forEach((L, li) => {
    const row = byLv[L], w = row.length * G.BW + (row.length - 1) * G.GX;
    const x0 = padx + (W - padx * 2 - w) / 2;
    row.forEach((n, i) => { pos[n.id] = {x: x0 + i * (G.BW + G.GX), y: G.PADY + li * (G.BH + G.GY)}; });
  });
  const bands = levels.map((L, li) => {
    const y = G.PADY + li * (G.BH + G.GY) - 10;
    const lb = (o.bandLabel || (v => `第 ${v} 层`))(L);
    return `<rect class="band" x="0" y="${y}" width="${W}" height="${G.BH + 20}" rx="10"></rect>
            <text class="band-lb" x="8" y="${y + G.BH / 2 + 4}">${esc(lb)}</text>`;
  }).join("");
  const paths = edges.map(e => {
    const a = pos[e.from], b = pos[e.to];
    if(!a || !b) return "";
    const x1 = a.x + G.BW / 2, y1 = a.y + G.BH, x2 = b.x + G.BW / 2, y2 = b.y, my = (y1 + y2) / 2;
    return `<path class="edge${dashed.includes(e.kind) ? " dash" : ""}${e.kind ? " k-" + e.kind : ""}"
      data-f="${esc(e.from)}" data-t="${esc(e.to)}"
      d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"></path>`;
  }).join("");
  const boxes = nodes.map(n => {
    const p = pos[n.id]; if(!p) return "";
    const bits = (n.meta || []).join(" · ");
    return `<g class="node${n.core ? " core" : ""}${n.crit ? " crit" : ""}${n.faded ? " dimstatic" : ""}" data-id="${esc(n.id)}"><title>${esc(n.tip || n.name)}</title>
      <rect x="${p.x}" y="${p.y}" width="${G.BW}" height="${G.BH}" rx="12"></rect>
      <text class="nm" x="${p.x + 10}" y="${p.y + 17}">${esc(n.pre || "")}${esc(_trunc(n.name, 9))}</text>
      ${bits ? `<text class="mt" x="${p.x + 10}" y="${p.y + 31}">${esc(_trunc(bits, 17))}</text>` : ""}</g>`;
  }).join("");
  return {svg: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${bands}${paths}${boxes}</svg>`,
          W, H, levels: levels.length};
}

// 实体分层: 不引用别人的 = 最基础(第 1 层) —— 先后由【真实外键】决定, 不靠猜
function levelsOf(ids, edges){
  const out = new Map();
  ids.forEach(i => out.set(i, []));
  edges.forEach(e => { if(out.has(e.from)) out.get(e.from).push(e.to); });
  const lv = new Map(), seen = new Set();
  const calc = id => {
    if(lv.has(id)) return lv.get(id);
    if(seen.has(id)) return 1;                     // 环 ⇒ 不递归爆栈
    seen.add(id);
    const ts = out.get(id) || [];
    const v = ts.length ? 1 + Math.max(...ts.map(calc)) : 1;
    seen.delete(id); lv.set(id, v);
    return v;
  };
  ids.forEach(calc);
  return lv;
}

function renderFlow(d){
  const mods = d.root || [];
  if(!mods.length) return `<div class="empty">暂无模块</div>`;
  const kp = d.critical_path || {};
  const critPairs = new Set((kp.edges || []).map(e => `${e.from}>${e.to}`));
  const nodes = mods.map(m => {
    const bits = [];
    if(m.core) bits.push("★ 核心");
    else if(m.depended_by) bits.push(`被 ${m.depended_by} 个依赖`);
    if(m.kids) bits.push(`${m.kids} 个子模块`);
    if(m.critical) bits.push("★ 关键路径");
    return {id: m.id, name: m.name, level: m.level || 1, core: !!m.core,
            crit: !!m.critical, pre: (MARK[m.status] || "☐") + " ", meta: bits,
            tip: [m.name, (m.deps || []).length ? "前置: " + m.deps.join(" / ") : "无前置（可先做）",
                  `第 ${m.level} 批`].join("｜")};
  });
  // ★ 把关键路径那条链的边单独标出来（橙线）—— 关系要看得见, 不是写一句"有关键路径"
  const edges = (d.edges || []).map(e => ({from: e.from, to: e.to,
    kind: critPairs.has(`${e.from}>${e.to}`) ? "crit" : ""}));
  const g = svgBand(nodes, edges, {bandLabel: L => `第 ${L} 批`});
  const kpline = kp.available
    ? `<div class="kpline">★ <b>关键路径</b>=橙色那条链（图中加粗的模块与连线）: <b>${(kp.modules||[]).length}</b> 个模块 ·
        链上 <b>${kp.total_leaves}</b> 个任务 —— 推迟链上任一条 = 拖整棵树; 链外模块可并行<br/>判定依据: ${esc(kp.basis)}</div>`
    : (kp.reason ? `<div class="kpline">⚠ 关键路径算不出: ${esc(kp.reason)}（★ 不硬给一条假的）</div>` : "");
  const ext = (d.external_deps || []).length
    ? ` · 另有 ${d.external_deps.length} 条依赖指向子模块（点模块展开看）` : "";
  return `<p class="sub" style="margin:0 0 10px">${d.modules} 个模块 · ${(d.edges || []).length} 条关系 · ${g.levels} 批（自上而下做）${ext}</p>
    ${kpline}
    ${g.svg}
    <div class="legend">
      <span><b>箭头</b> = 前置关系: 上面先做完, 才能做下面</span>
      <span><b>橙色</b> = 关键路径（决定整体完工的那条链）</span>
      <span><b>★</b> = 核心（被最多模块依赖）</span>
      <span><b>鼠标移到模块</b> = 高亮它整条上下游链</span>
      <span><b>点模块</b> = 选中 ⇒ ★ 另外两张图一起亮/滚（再点或 Esc 取消）</span>
    </div>
    <div id="kids"></div>`;
}

// ── ★★ 跨视图联动（Founder: "页面上有很多视图，数据是联动的么"）──────────
//   三个投影读同一份树 ⇒ 用 **module id** 互相定位:
//     点任一处的模块 ⇒ 三张图一起亮（功能链路图亮上下游链 · 数据流程图亮它碰的实体 ·
//     待办清单滚到那一块并连同子树点亮）; 再点一次 / 按 Esc 取消。
//   悬停仍只是【本图内部】追链 —— 不跨图, 免得鼠标一动三屏乱跳。
let SELECTED = null;

function flowAdj(){
  const UP = new Map(), DN = new Map();
  const push = (m, k, v) => { if(!m.has(k)) m.set(k, []); m.get(k).push(v); };
  (FLOW.edges || []).forEach(e => { push(UP, e.to, e.from); push(DN, e.from, e.to); });
  return {UP, DN};
}

function paintFlow(id){
  const svg = document.querySelector("#flow svg");
  if(!svg) return;
  const {UP, DN} = flowAdj();
  const up = id ? _closure(id, UP) : null, dn = id ? _closure(id, DN) : null;
  const hot = x => !id || x === id || up.has(x) || dn.has(x);
  svg.querySelectorAll(".node").forEach(n => {
    const i = n.dataset.id;
    n.classList.toggle("dim", !!id && !hot(i));
    n.classList.toggle("hot", !!id && hot(i));
    n.classList.toggle("up", !!id && up.has(i));
    n.classList.toggle("sel", !!id && i === id);
  });
  svg.querySelectorAll(".edge").forEach(p => {
    const on = !id || (hot(p.dataset.f) && hot(p.dataset.t));
    p.classList.toggle("dim", !!id && !on);
    p.classList.toggle("hot", !!id && on);
    p.classList.toggle("up", !!id && on
      && (up.has(p.dataset.f) || p.dataset.f === id)
      && (up.has(p.dataset.t) || p.dataset.t === id));
  });
}

function paintDf(id){
  const svg = document.querySelector("#df svg");   // 只动第①张（模块↔实体）; 实体关系图与模块无关
  if(!svg) return;
  const touch = new Set();
  if(id){
    svg.querySelectorAll(".edge").forEach(e => {
      if(e.dataset.f === id) touch.add(e.dataset.t);
      if(e.dataset.t === id) touch.add(e.dataset.f);
    });
  }
  svg.querySelectorAll(".node").forEach(n => {
    const i = n.dataset.id, on = !id || i === id || touch.has(i);
    n.classList.toggle("dim", !!id && !on);
    n.classList.toggle("hot", !!id && on);
    n.classList.toggle("sel", !!id && i === id);
  });
  svg.querySelectorAll(".edge").forEach(e => {
    const on = !id || e.dataset.f === id || e.dataset.t === id;
    e.classList.toggle("dim", !!id && !on);
    e.classList.toggle("hot", !!id && on);
  });
}

// 待办清单: 行是【扁平序 + data-depth】⇒ 模块的子树 = 它后面那些更深的行
function paintTodo(id){
  const rows = [...document.querySelectorAll("#todo .row")];
  rows.forEach(r => r.classList.remove("sel", "sel-kid", "dimsel"));
  if(!id) return;
  const idx = rows.findIndex(r => r.dataset.id === id);
  if(idx < 0) return;
  const base = Number(rows[idx].dataset.depth || 0);
  rows.forEach(r => r.classList.add("dimsel"));
  rows[idx].classList.add("sel");
  rows[idx].classList.remove("dimsel");
  for(let k = idx + 1; k < rows.length; k++){
    if(Number(rows[k].dataset.depth || 0) <= base) break;
    rows[k].classList.add("sel-kid");
    rows[k].classList.remove("dimsel");
  }
  rows[idx].scrollIntoView({block: "center", behavior: "smooth"});
}

function selectModule(id){
  SELECTED = (SELECTED === id) ? null : id;
  paintFlow(SELECTED);
  paintDf(SELECTED);
  paintTodo(SELECTED);
  const hint = document.getElementById("selhint");
  if(hint){
    hint.textContent = SELECTED
      ? "已选中一个模块 —— 三张图都跟着亮/滚了；再点一次 或 按 Esc 取消"
      : "";
  }
}

function wireFlow(){
  const svg = document.querySelector("#flow svg");
  if(!svg || !FLOW) return;
  svg.querySelectorAll(".node").forEach(n => {
    n.addEventListener("mouseenter", () => paintFlow(n.dataset.id));
    n.addEventListener("focus", () => paintFlow(n.dataset.id));
    n.addEventListener("mouseleave", () => paintFlow(SELECTED));
    n.addEventListener("click", () => { showKids(n.dataset.id); selectModule(n.dataset.id); });
  });
}

// 点模块 ⇒ 展开它的子模块（同一份数据, 只是换一层看）
function showKids(id){
  const m = (FLOW.root || []).find(x => x.id === id), box = document.getElementById("kids");
  if(!m || !box) return;
  const pre = (m.deps || []).length ? `前置: ${esc(m.deps.join(" / "))}` : "无前置（可先做）";
  const kids = m.children || [];
  box.innerHTML = `<div class="kt"><b>${esc(m.name)}</b> · ${pre} · 子模块 ${kids.length} 个</div>`
    + (kids.length ? kids.map(c => renderMod(c, 0)).join("")
                   : `<div class="kt">（还没细拆到子模块）</div>`);
}

// ── 数据流程图（投影 C）──────────────────────────────────────────
//    ★ 只画真实来源: 实体与实体关系来自项目 DDL; 模块↔实体 有声明=实线, 只有文案=虚线线索
let DFLOW = null;

// 二分图（左模块列 / 右实体列）—— 关系用【左右两列 + 曲线】, 不用分层（分层读不出"谁碰谁"）
function svgBipartite(left, right, links){
  const BW = 148, BH = 32, GY = 10, PAD = 8, MID = 170;
  const W = PAD * 2 + BW * 2 + MID;
  const H = Math.max(left.length, right.length, 1) * (BH + GY) + PAD * 2 - GY;
  const col = (arr, x) => {
    const top = PAD + (H - PAD * 2 - (arr.length * (BH + GY) - GY)) / 2;
    const m = {};
    arr.forEach((n, i) => { m[n.id] = {x, y: top + i * (BH + GY)}; });
    return m;
  };
  const lp = col(left, PAD), rp = col(right, W - PAD - BW);
  const paths = links.map(k => {
    const a = lp[k.from], b = rp[k.to];
    if(!a || !b) return "";
    const x1 = a.x + BW, y1 = a.y + BH / 2, x2 = b.x, y2 = b.y + BH / 2;
    return `<path class="edge${k.kind === "evidence" ? " dash" : ""}${k.kind ? " k-" + k.kind : ""}"
      data-f="${esc(k.from)}" data-t="${esc(k.to)}"
      d="M${x1},${y1} C${x1 + MID * .45},${y1} ${x2 - MID * .45},${y2} ${x2},${y2}"></path>`;
  }).join("");
  const box = (n, p) => `<g class="node${n.faded ? " dimstatic" : ""}" data-id="${esc(n.id)}"><title>${esc(n.tip || n.name)}</title>
    <rect x="${p.x}" y="${p.y}" width="${BW}" height="${BH}" rx="10"></rect>
    <text class="nm" x="${p.x + 9}" y="${p.y + 20}">${esc(_trunc(n.name + (n.meta ? " · " + n.meta : ""), 18))}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${paths}${left.map(n => box(n, lp[n.id])).join("")}${right.map(n => box(n, rp[n.id])).join("")}</svg>`;
}

function renderDataFlow(d){
  if(!d || !d.available){
    return `<div class="empty">没有数据模型可依据 —— 项目里找不到 *.prisma / *.sql（不编一张图）</div>`;
  }
  const ents = d.entities || [], used = new Set(d.entities_used || []);
  const linked = new Set((d.module_links || []).map(k => k.module_id));
  const mods = (d.modules || []).map(m => ({id: m.id, name: m.name,
                                           faded: !linked.has(m.id),
                                           tip: (linked.has(m.id) ? "" : "没有任何实体线索（不编）｜") + m.name}));
  const right = ents.map(e => ({id: "E:" + e.name, name: e.name,
                                meta: e.refs ? `被 ${e.refs} 引用` : "", faded: !used.has(e.name),
                                tip: `${e.name}｜被 ${e.refs} 张表引用`}));
  const bi = svgBipartite(mods, right,
    (d.module_links || []).map(k => ({from: k.module_id, to: "E:" + k.entity, kind: k.kind})));

  const fkIds = ents.map(e => "E:" + e.name);
  const fk = (d.relations || []).map(r => ({from: "E:" + r.from, to: "E:" + r.to, kind: "fk"}));
  const lv = levelsOf(fkIds, fk);
  const er = svgBand(ents.map(e => ({
      id: "E:" + e.name, name: e.name, level: lv.get("E:" + e.name) || 1,
      meta: e.refs ? [`被 ${e.refs} 引用`] : [], tip: `${e.name}｜被 ${e.refs} 张表引用`})),
    fk, {bandLabel: L => `第 ${L} 层`});

  return `<p class="srcline">数据来源: <b>${esc(d.source_file || "（无）")}</b> · 实体 <b>${ents.length}</b> 张
     · 真实外键 <b>${(d.relations || []).length}</b> 条 · 模块↔实体连线 <b>${(d.module_links || []).length}</b> 条
     （声明 ${d.declared_count} / 线索 ${d.evidence_count}）· 覆盖 <b>${d.coverage.with_entity}/${d.coverage.modules}</b> 个模块</p>
    <h3 class="sub" style="margin:16px 0 8px">① 模块 ↔ 数据实体</h3>
    ${bi}
    <h3 class="sub" style="margin:20px 0 8px">② 数据实体之间的关系（真实外键 · 来自 DDL）</h3>
    ${er.svg}
    <div class="legend">
      <span><b>虚线</b> = 线索（模块文案里出现过这个实体名, 不是系统记录）</span>
      <span><b>蓝实线</b> = 产线声明（模块读/写这些实体）</span>
      <span><b>绿线</b> = 真实外键（DDL 的 @relation）</span>
      <span><b>灰掉</b> = 没有任何模块碰它</span>
      <span><b>点模块</b> = 选中 ⇒ 另外两张图一起亮（再点或 Esc 取消）</span>
    </div>
    ${(d.coverage.missing || []).length ? `<div class="gap">未覆盖的模块（${d.coverage.missing.length} 个）: ${esc(d.coverage.missing.join("、"))} —— ${d.declared_count ? "产线声明为空（拿不准就不瞎标）" : "它们的文案里没出现任何实体名（还没声明过）"} ⇒ 图上没有它们的线（不编）</div>` : ""}
    ${d.hint ? `<div class="gap">${esc(d.hint)}</div>` : ""}`;
}

function wireSelection(){
  const df = document.querySelector("#df svg");        // 只给第①张挂联动（模块↔实体那张）
  if(df && DFLOW){
    df.querySelectorAll(".node").forEach(n => {
      const isMod = !String(n.dataset.id || "").startsWith("E:");
      n.addEventListener("mouseenter", () => paintDf(n.dataset.id));
      n.addEventListener("mouseleave", () => paintDf(SELECTED));
      if(isMod){
        n.style.cursor = "pointer";
        n.addEventListener("click", () => selectModule(n.dataset.id));
      }
    });
  }
  // 待办清单: 只有【顶层模块行】当模块可点（子任务行是"活", 不是"模块"）
  document.querySelectorAll('#todo .row[data-kind="domain"]').forEach(r => {
    if(Number(r.dataset.depth || 0) !== 0) return;
    r.addEventListener("click", () => selectModule(r.dataset.id));
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && SELECTED) selectModule(SELECTED);
  });
}

async function load(planId){
  const both = await api(`/api/trees/${encodeURIComponent(planId)}/both`);
  const t = both.todo || {};
  $("title").textContent = t.plan_id || planId;
  $("status").textContent = t.status === "candidate" ? "候选态（待确认）" : (t.status || "");
  $("bar").style.width = (t.percent||0) + "%";
  $("todo").innerHTML = renderTodo(t);
  FLOW = both.flow || {};
  $("flow").innerHTML = renderFlow(FLOW);
  wireFlow();
  DFLOW = both.dataflow || null;
  $("df").innerHTML = renderDataFlow(DFLOW);
  wireSelection();
  $("msg").innerHTML = `<p class="sub" style="margin:0 0 18px">进度 ${t.done}/${t.total}（${t.percent}%）· 共 ${(both.flow||{}).modules||0} 个模块</p>`;
}

async function boot(){
  try{
    const list = await api("/api/trees");
    const sel = $("pick");
    if(!list.trees.length){ err("没有任务树 —— 先用 `factory tasktree decompose` 生成一棵"); return; }
    sel.innerHTML = list.trees.map(x =>
      `<option value="${esc(x.plan_id)}">${esc(x.plan_id)} · ${esc(x.project_id||"无项目")} · ${x.done}/${x.leaves}</option>`).join("");
    sel.onchange = () => load(sel.value).catch(e => err(e.message));
    await load(list.trees[0].plan_id);
  }catch(e){ err("接口调用失败: " + e.message + "（确认 API 已启动）"); }
}
boot();
</script>
