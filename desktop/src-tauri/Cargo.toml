[package]
name = "ai-software-factory-desktop"
version = "0.1.0"
description = "AI Software Factory Desktop Shell (Phase 15A-3a)"
authors = ["AI Software Factory"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
