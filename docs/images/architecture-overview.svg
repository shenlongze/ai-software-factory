    <text x="250" y="385" font-size="10.5" fill="#7dd3fc" text-anchor="start">Git 只读审计 · 零仓库写</text>
    <text x="215" y="399" font-size="10" fill="#5b7a99" text-anchor="start">失败安全永不抛 (LC_ALL=C)</text>
    <rect x="520" y="368" width="300" height="37" rx="7" fill="#0e1b2e" fill-opacity="0.6" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="535" y="385" font-size="13" font-weight="bold" fill="#e0f2fe" text-anchor="start">change</text>
    <text x="590" y="385" font-size="10.5" fill="#7dd3fc" text-anchor="start">变更智能 · commit→task 关联</text>
    <text x="535" y="399" font-size="10" fill="#5b7a99" text-anchor="start">无 LLM · L4 Change 验证</text>
    <rect x="840" y="368" width="300" height="37" rx="7" fill="#0e1b2e" fill-opacity="0.6" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="855" y="385" font-size="13" font-weight="bold" fill="#e0f2fe" text-anchor="start">changeflow</text>
    <text x="926" y="385" font-size="10.5" fill="#7dd3fc" text-anchor="start">变更驱动工作流 · 触发器</text>
    <text x="855" y="399" font-size="10" fill="#5b7a99" text-anchor="start">evaluate → workflow run</text>
    <rect x="200" y="413" width="300" height="37" rx="7" fill="#0e1b2e" fill-opacity="0.6" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="215" y="430" font-size="13" font-weight="bold" fill="#e0f2fe" text-anchor="start">providers</text>
    <text x="280" y="430" font-size="10.5" fill="#7dd3fc" text-anchor="start">LLM Provider 抽象 · 不绑定厂商</text>
    <text x="215" y="444" font-size="10" fill="#5b7a99" text-anchor="start">注册表/选择器/用量/成本/能力目录</text>
    <rect x="520" y="413" width="300" height="37" rx="7" fill="#0e1b2e" fill-opacity="0.6" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="535" y="430" font-size="13" font-weight="bold" fill="#e0f2fe" text-anchor="start">product</text>
    <text x="590" y="430" font-size="10.5" fill="#7dd3fc" text-anchor="start">产品智能 · Idea→Artifact→审批</text>
    <text x="535" y="444" font-size="10" fill="#5b7a99" text-anchor="start">ApprovalGate + Lifecycle 编排</text>
    <rect x="840" y="413" width="300" height="37" rx="7" fill="#0e1b2e" fill-opacity="0.6" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="855" y="430" font-size="13" font-weight="bold" fill="#e0f2fe" text-anchor="start">understanding</text>
    <text x="948" y="430" font-size="10.5" fill="#7dd3fc" text-anchor="start">项目理解 · 只读分析</text>
    <text x="855" y="444" font-size="10" fill="#5b7a99" text-anchor="start">10 阶段 + 7 Artifact 注册化</text>
  </g>

  <!-- 箭头 L2→L1 -->
  <line x1="600" y1="472" x2="600" y2="502" stroke="#7dd3fc" stroke-width="1.8" marker-end="url(#arrowDown)"/>
  <text x="616" y="492" font-size="11" fill="#7dd3fc">唯一执行出口: RuntimeAdapter (只 import events)</text>

  <!-- ==================== L1 Core ==================== -->
  <rect x="40" y="505" width="1120" height="160" rx="10" fill="url(#coreGrad)" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="40" y="505" width="145" height="160" rx="10" fill="#0a1428" opacity="0.85"/>
  <text x="112" y="540" font-size="21" font-weight="bold" fill="#93c5fd" text-anchor="middle">L1</text>
  <text x="112" y="560" font-size="11.5" fill="#bfdbfe" text-anchor="middle">Core</text>
  <text x="112" y="578" font-size="10.5" fill="#93c5fd" text-anchor="middle">冻结原语</text>
  <text x="112" y="596" font-size="9.5" fill="#5b7a99" text-anchor="middle">2026-08 冻结</text>
  <text x="112" y="612" font-size="9.5" fill="#5b7a99" text-anchor="middle">零领域依赖</text>
  <g>
    <rect x="200" y="528" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="212" y="546" font-size="12" fill="#dbeafe">events · 事件日志 (唯一事实源)</text>
    <rect x="442" y="528" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="454" y="546" font-size="12" fill="#dbeafe">tasks · 任务状态机</text>
    <rect x="684" y="528" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="696" y="546" font-size="12" fill="#dbeafe">workflows · 流程状态机</text>
    <rect x="926" y="528" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="938" y="546" font-size="12" fill="#dbeafe">agents · Agent/技能注册</text>
    <rect x="200" y="562" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="212" y="580" font-size="12" fill="#dbeafe">assignment · 分配状态机</text>
    <rect x="442" y="562" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="454" y="580" font-size="12" fill="#dbeafe">execution · 执行生命周期</text>
    <rect x="684" y="562" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="696" y="580" font-size="12" fill="#dbeafe">runtime · 执行抽象 (Adapter)</text>
    <rect x="926" y="562" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="938" y="580" font-size="12" fill="#dbeafe">recovery · 断点续跑</text>
    <rect x="200" y="596" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="212" y="614" font-size="12" fill="#dbeafe">orchestration · 自动编排</text>
    <rect x="442" y="596" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="454" y="614" font-size="12" fill="#dbeafe">validation · 三层验证 (L1–L3)</text>
    <rect x="684" y="596" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="696" y="614" font-size="12" fill="#dbeafe">metrics · 六域指标</text>
    <rect x="926" y="596" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="938" y="614" font-size="12" fill="#dbeafe">dashboard · 只读快照</text>
    <rect x="200" y="630" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="212" y="648" font-size="12" fill="#dbeafe">project · 项目配置</text>
    <rect x="442" y="630" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="454" y="648" font-size="12" fill="#dbeafe">workspace · 工作区组织</text>
    <rect x="684" y="630" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="696" y="648" font-size="12" fill="#dbeafe">runtimes · Runtime 实现</text>
    <rect x="926" y="630" width="232" height="27" rx="5" fill="#0e1b2e" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="938" y="648" font-size="12" fill="#dbeafe">cli · 组合根 (23 命令组)</text>
  </g>

  <!-- 底部说明 -->
  <text x="60" y="682" font-size="11" fill="#64748b">Core 冻结 (2026-08) · 新能力一律 Extension 声明式注册 (零 Core 改动) · Intelligence 只分析+推荐+解释 · Console 只读 + 人工审批</text>
</svg>
