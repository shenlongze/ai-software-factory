<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16294d"/>
      <stop offset="100%" stop-color="#101d3a"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3a4f"/>
      <stop offset="100%" stop-color="#0b2d3e"/>
    </linearGradient>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#22d3ee" opacity="0.5"/>

  <!-- 标题 -->
  <text x="60" y="32" font-size="21" font-weight="bold" fill="#e5f6ff">AI Software Factory — Intelligence Loop 智能闭环</text>
  <text x="1140" y="28" font-size="11.5" fill="#64748b" text-anchor="end">Task → Recommendation → Execution → Usage → Result → Experience → Better Recommendation</text>
  <line x1="60" y1="45" x2="1140" y2="45" stroke="#1e3a5f" stroke-width="1"/>

  <!-- 环形弧箭头 (顺时针, 沿半径 240 的圆) -->
  <g fill="none" stroke="#5eead4" stroke-width="2.2" opacity="0.9">
    <!-- Task → Recommendation -->
    <path d="M 674.2 131.8 A 240 240 0 0 1 732.2 159.7" marker-end="url(#arrowLoop)"/>
    <!-- Recommendation → Execution -->
    <path d="M 732.2 159.7 A 240 240 0 0 1 839.0 338.5" marker-end="url(#arrowLoop)"/>
    <!-- Execution → Usage -->
    <path d="M 806.0 483.1 A 240 240 0 0 1 765.8 533.5" marker-end="url(#arrowLoop)"/>
    <!-- Usage → Result -->
    <path d="M 632.2 597.8 A 240 240 0 0 1 567.8 597.8" marker-end="url(#arrowLoop)"/>
    <!-- Result → Experience -->
    <path d="M 434.2 533.5 A 240 240 0 0 1 394.0 483.1" marker-end="url(#arrowLoop)"/>
    <!-- Experience → Better Recommendation -->
    <path d="M 361.0 338.5 A 240 240 0 0 1 375.2 275.8" marker-end="url(#arrowLoop)"/>
    <!-- Better Recommendation → Task (闭环) -->
    <path d="M 467.8 159.7 A 240 240 0 0 1 525.8 131.8" marker-end="url(#arrowLoop)"/>
  </g>

  <!-- 节点 1: Task -->
  <circle cx="600" cy="120" r="56" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="117" font-size="17" font-weight="bold" fill="#e0f7ff" text-anchor="middle">任务</text>
  <text x="600" y="137" font-size="10.5" fill="#7dd3fc" text-anchor="middle">Task</text>

  <!-- 节点 2: Recommendation -->
  <circle cx="787.6" cy="210.4" r="56" fill="url(#nodeGrad)" stroke="#2dd4bf" stroke-width="2"/>
  <text x="787.6" y="207" font-size="16" font-weight="bold" fill="#e0f7ff" text-anchor="middle">推荐</text>
  <text x="787.6" y="227" font-size="10.5" fill="#5eead4" text-anchor="middle">Recommendation</text>

  <!-- 节点 3: Execution -->
  <circle cx="834" cy="413.4" r="56" fill="url(#nodeGrad)" stroke="#2dd4bf" stroke-width="2"/>
  <text x="834" y="410" font-size="17" font-weight="bold" fill="#e0f7ff" text-anchor="middle">执行</text>
  <text x="834" y="430" font-size="10.5" fill="#5eead4" text-anchor="middle">Execution</text>

  <!-- 节点 4: Usage -->
  <circle cx="704.1" cy="576.2" r="56" fill="url(#nodeGrad)" stroke="#0ea5e9" stroke-width="2"/>
  <text x="704.1" y="573" font-size="15" font-weight="bold" fill="#e0f7ff" text-anchor="middle">用量回流</text>
  <text x="704.1" y="593" font-size="10.5" fill="#7dd3fc" text-anchor="middle">Usage</text>

  <!-- 节点 5: Result -->
  <circle cx="495.9" cy="576.2" r="56" fill="url(#nodeGrad)" stroke="#0ea5e9" stroke-width="2"/>
  <text x="495.9" y="573" font-size="17" font-weight="bold" fill="#e0f7ff" text-anchor="middle">结果</text>
  <text x="495.9" y="593" font-size="10.5" fill="#7dd3fc" text-anchor="middle">Result</text>

  <!-- 节点 6: Experience -->
  <circle cx="366" cy="413.4" r="56" fill="url(#coreGrad)" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="366" y="410" font-size="15" font-weight="bold" fill="#e0f7ff" text-anchor="middle">经验沉淀</text>
  <text x="366" y="430" font-size="10.5" fill="#67e8f9" text-anchor="middle">Experience</text>

  <!-- 节点 7: Better Recommendation -->
  <circle cx="412.4" cy="210.4" r="56" fill="url(#nodeGrad)" stroke="#22d3ee" stroke-width="2"/>
  <text x="412.4" y="204" font-size="16" font-weight="bold" fill="#e0f7ff" text-anchor="middle">更优推荐</text>
  <text x="412.4" y="224" font-size="10.5" fill="#67e8f9" text-anchor="middle">Better Rec</text>

  <!-- 中心环 + 说明 -->
  <circle cx="600" cy="360" r="118" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="600" cy="360" r="92" fill="#0b2233" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="600" y="344" font-size="19" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Intelligence</text>
  <text x="600" y="366" font-size="13" fill="#67e8f9" text-anchor="middle">Loop</text>
  <text x="600" y="392" font-size="11" fill="#7dd3fc" text-anchor="middle">只记录事实 · 只读分析</text>
  <text x="600" y="410" font-size="10.5" fill="#fcd34d" text-anchor="middle">不自动修改自身</text>

  <!-- 闭环徽章 -->
  <rect x="484" y="118" width="86" height="20" rx="10" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="527" y="132" font-size="10.5" font-weight="bold" fill="#67e8f9" text-anchor="middle">闭环 Loop</text>

  <!-- 底部说明 -->
  <line x1="60" y1="636" x2="1140" y2="636" stroke="#1e3a5f" stroke-width="1"/>
  <text x="60" y="660" font-size="12" fill="#cbd5e1">① Task 完成 → ② Recommendation 四因素评分 (Capability 0.35 / Performance 0.30 / Cost 0.20 / Experience 0.15)</text>
  <text x="60" y="684" font-size="12" fill="#cbd5e1">③ Execution → ④ Usage 用量回流 (cost / performance 因素) → ⑤ Result → ⑥ Experience 沉淀 (半衰期 30 天 + 正负聚合) → ⑦ 更优推荐 (经验分 ≤ 能力分)</text>
</svg>
