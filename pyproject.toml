[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "1.3.9"
description = "AI Software Factory — An AI Workforce Operating System (build, manage and govern AI workers)"
readme = "README.md"
requires-python = ">=3.12"
# 运行依赖: pydantic (模型) + rich (Dashboard 渲染, Phase 4C-4) +
# pyyaml (examples/*.yaml 项目配置解析, Phase 5A, ADR-0013); 存储用标准库
# sqlite3/json, CLI 用 argparse
dependencies = [
    "pydantic>=2",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prompt_toolkit>=3.0",   # ★ 会话输入（照 Hermes: 它的 REPL 就是 prompt_toolkit ⇒ 边打边弹补全 ✓）
]

[project.scripts]
# 统一入口 (S10-031 Task 2 + 修复): factory-console/cli_factory.py 的 main() —
# init/doctor/config/start/project/run 等全部命令。目录名 factory-console 含
# 连字符, 生成式 console script 无法 `from factory-console... import` (语法错误),
# 故经 [tool.setuptools] package-dir 映射为合法包名 factory_console 后直接可导入。
# ★ 2026-09-15 入口切换: 老 CLI（_pending_migration）退役 → 新 CLI（apps/cli）。
#   切换依据: 新区 → 老区依赖已归零（12 → 0）; 老区整体删除。
factory = "apps.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
# S10-031 修复 (Design Note, package_dir 映射方案): 旧配置 packages.find
# where=["factory-core","factory-console","factory_console"] 把 factory_console
# 当"搜索根"而非"包", setuptools 从 where 目录内部找包 → factory_console 未入
# wheel (空壳根因)。package-dir 最长前缀匹配: "factory_console" → "factory-console"
# 使 factory_console 及其子包 (api/web/web.backend) 映射到连字符目录;
# "" → "factory-core" 使 factory-core 下 27 个顶层子包源码根保持 factory-core/ 前缀
# (等价旧 find where=["factory-core"])。映射后 factory_console 即真实代码包
# (cli_factory/config/llm_control/...), 不再需要 importlib 胶水转发。
package-dir = { "ai_factory_os" = "src/ai_factory_os", "apps" = "apps" }
# ★ 2026-09-21 修（对外发布 blocked）: 原来是**手工枚举** packages = [4 条] ——
#   "ai_factory_os" 只列顶层, 其下 bootstrap/contracts/core/infrastructure/plugins/services
#   **全都没进 wheel** ⇒ `pip install git+…` 装得上但 `factory` 起不来
#   （ModuleNotFoundError: No module named 'ai_factory_os.plugins'），本地 editable 看不出病。
#   现改为**自动发现**: where 给两个根（src/ 与仓库根），include 限定两个前缀 ——
#   以后新增子包不用再同步任何列表（原注释里那句"新增子包须同步本列表"就是这次翻车的原因）。
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ai_factory_os*", "apps*"]

# ★ 2026-09-15: [tool.setuptools.package-data] 的 factory_console 前端 dist 随老区删除
#   （旧 Web 前端已不在仓库; 新 Web 面按 Founder 决定暂缓）

[tool.pytest.ini_options]
testpaths = ["scripts", "examples"]  # scripts=门禁守卫（见下 python_files）; examples=demo
# ★ 2026-09-20: 门禁守卫都在 scripts/smoke_*.py, 但**裸 pytest 之前一个都收不到**
#   （testpaths=[] + 默认只认 test_*.py）⇒ 每次都要人工带路径, "verification" 形同虚设。
#   ⇒ 这里**显式登记**门禁守卫（含 test_* 用例的那几个; 其余 smoke_*.py 是临时脚本, 故意不收 —— 
#      它们有导入副作用/会长跑, 收进来会污染裸 pytest）。
#   ★ 新增守卫: 用 `test_*.py` 命名, 或到这里登记。
python_files = [
    "test_*.py",
    "smoke_user_view.py",      # 用户视图（三投影 + 联动接线 + 数据流程 + mermaid + pytest 兼容层）
    "smoke_exec_dispatch.py",  # 执行面: 调度器摊平依赖
    "smoke_keypath.py",        # 关键路径判据
    "smoke_priority.py",       # 优先级 ABC + 人工最高
    "smoke_staffing.py",       # 派工（谁做）→ 声明后必须 READY
    "smoke_chain_links.py",    # 链路接缝（会话→想法 · 监控看得见执行 · 执行状态语义）
]
# ★ 2026-09-15: src/legacy/factory-core 随老区删除 ⇒ 只剩 src
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
