[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "1.0.0-rc1"
description = "AI Software Factory — 四层架构 AI 软件工厂 (Core 冻结原语 + Extension 领域能力 + Intelligence 决策智能 + Human Console 人类控制台)"
readme = "README.md"
requires-python = ">=3.12"
# 运行依赖: pydantic (模型) + rich (Dashboard 渲染, Phase 4C-4) +
# pyyaml (examples/*.yaml 项目配置解析, Phase 5A, ADR-0013); 存储用标准库
# sqlite3/json, CLI 用 argparse
dependencies = ["pydantic>=2", "rich>=13", "pyyaml>=6"]

[project.scripts]
# 统一入口 (S10-031 Task 2): factory-console/cli_factory.py 的 main() —
# init/doctor/config/start/project/run 等全部命令。目录名 factory-console 含
# 连字符, 生成式 console script 无法 `from factory-console... import` (语法错误),
# 故经 factory_console 别名包 (importlib 转发) 暴露为可导入路径。
factory = "factory_console.cli_factory:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
# factory-core/ 为源码根目录, events 等子模块为独立顶层包;
# factory-console/ (统一 CLI 层, 含连字符) + factory_console/ (导入别名) 一并入包
where = ["factory-core", "factory-console", "factory_console"]

[tool.setuptools.package-data]
# 前端 dist 打包入 wheel (S10-030 Task 002 / S10-031 Task 2): pip install 后
# factory start 免 node 托管静态前端。dist/ 为构建产物 (gitignore), 打包时读磁盘。
"factory-console" = [
    "web/frontend/dist/index.html",
    "web/frontend/dist/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 使 tests/ 可直接 `from events import ...` (editable install 之外的双保险)
pythonpath = ["factory-core"]

[tool.ruff]
line-length = 100
target-version = "py312"
